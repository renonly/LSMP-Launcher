name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # instalador customizado (embute o instalador acima e vai pra mesma release)
      - run: node installer/prepare.js
      - run: npm --prefix installer install
      - run: npm --prefix installer run dist
      - run: gh release upload "${{ github.ref_name }}" installer/dist/Instalar-ESMP.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
